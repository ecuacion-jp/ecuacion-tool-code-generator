name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

env:
  MAVEN_OPTS: -Xmx2g

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: ecuacion-tool-code-generator

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/exclude-windows-defender@main

      # Install dependencies in order (ecuacion-lib → ecuacion-utils → ecuacion-splib)
      - uses: ecuacion-jp/ecuacion-lib/.github/actions/install-ecuacion-dependency@main
        with:
          repository: ecuacion-jp/ecuacion-lib
          path: ecuacion-lib
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || (github.ref_name == 'main' && 'main' || 'develop') }}

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/install-ecuacion-dependency@main
        with:
          repository: ecuacion-jp/ecuacion-utils
          path: ecuacion-utils
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || (github.ref_name == 'main' && 'main' || 'develop') }}

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/install-ecuacion-dependency@main
        with:
          repository: ecuacion-jp/ecuacion-splib
          path: ecuacion-splib
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || (github.ref_name == 'main' && 'main' || 'develop') }}

      - name: Verify (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ecuacion-tool-code-generator
        run: mvn verify -Dwagon.skip=true -Dallure.report.skip=true -Dlicense.skip=true -e

      - name: Test (windows)
        if: matrix.os == 'windows-latest'
        working-directory: ecuacion-tool-code-generator
        run: mvn test -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dlicense.skip=true -Djacoco.skip=true -e
