name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. 1.0.0)'
        required: true

env:
  MAVEN_OPTS: -Xmx2g

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: ecuacion-tool-code-generator

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/resolve-tag@main
        id: tag

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Install dependencies in order (ecuacion-lib → ecuacion-utils → ecuacion-splib)
      - uses: ecuacion-jp/ecuacion-lib/.github/actions/install-ecuacion-dependency@main
        with:
          repository: ecuacion-jp/ecuacion-lib
          path: ecuacion-lib
          extra-mvn-args: -Dwagon.skip=true

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/install-ecuacion-dependency@main
        with:
          repository: ecuacion-jp/ecuacion-utils
          path: ecuacion-utils
          extra-mvn-args: -Dwagon.skip=true

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/install-ecuacion-dependency@main
        with:
          repository: ecuacion-jp/ecuacion-splib
          path: ecuacion-splib
          extra-mvn-args: -Dwagon.skip=true

      - name: Set version
        working-directory: ecuacion-tool-code-generator
        env:
          NEW_VERSION: ${{ steps.tag.outputs.value }}
        run: mvn versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false

      - name: Build
        working-directory: ecuacion-tool-code-generator
        run: mvn package -DskipTests -Dwagon.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dallure.report.skip=true -Djacoco.skip=true -Dlicense.skip=true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: |
            ecuacion-tool-code-generator/ecuacion-tool-code-generator-cli/target/ecuacion-tool-code-generator-cli-*[0-9].jar
            ecuacion-tool-code-generator/ecuacion-tool-code-generator-web/target/ecuacion-tool-code-generator-*.war
          generate_release_notes: true
