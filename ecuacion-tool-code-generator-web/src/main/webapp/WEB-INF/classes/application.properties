# This file lives under src/main/webapp/WEB-INF/classes (packaged straight into the WAR's
# WEB-INF/classes by maven-war-plugin) rather than src/main/resources, so that it never
# lands on Eclipse's own dev-time classpath alongside src/envs/local/resources -- both are
# wired as raw source folders onto the same output folder in .classpath, and a file named
# application.properties in both would collide silently.
#
# To place an environment-specific application.properties (or .yml) outside this WAR,
# put it under:
#
#   ${catalina.base}/app-conf/ecuacion-tool-code-generator/
#     (e.g. /usr/local/tomcat/app-conf/ecuacion-tool-code-generator/)
#
# The "optional:" prefix means this directory doesn't need to exist beforehand -- if it's
# missing, nothing is imported and this WAR's own embedded configuration
# (application-builtin.properties) is used as-is. Keys found there take precedence over
# application-builtin.properties.
#
# catalina.base falls back to "." when unset (e.g. when this WAR is run as an executable
# war/jar with an embedded container rather than deployed to an external Tomcat).
spring.config.import=optional:file:${catalina.base:.}/app-conf/ecuacion-tool-code-generator/
