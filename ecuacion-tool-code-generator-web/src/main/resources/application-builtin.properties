# spring
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.error.path=/public/error
# Drain the whole oversized request body instead of Tomcat's small default (2MB), so an
# upload exceeding max-file-size gets a prompt error response instead of the connection
# hanging/being dropped while the browser is still sending the rest of the file.
server.tomcat.max-swallow-size=-1

# ecuacion
jp.ecuacion.locale.use-root=true
jp.ecuacion.splib.web.home-page=public/showMarkdown/page?id=introduction
jp.ecuacion.splib.web.navbar.title=code-generator
jp.ecuacion.splib.web.navbar.default-page-path=public/showMarkdown/page?id=introduction
jp.ecuacion.splib.web.bootstrap.is-background-gradient=true
jp.ecuacion.splib.web.process-result-message.shown-at-each-item=false
jp.ecuacion.splib.web.process-result-message.shown-at-the-top=true
