templateVersion=alphanumeric characters, hyphens, underscores, and periods (e.g. 5.0.0, 5.0.0-SNAPSHOT)
systemName=alphanumeric characters and hyphens
basePackage=lowercase letters, digits, and periods
frameworkKind="Spring Framework" or "jakarta EE"
characterEncoding=a charset name such as UTF-8 (alphanumeric characters and -_:.)
lang=a locale string such as "en" or "en_US"
