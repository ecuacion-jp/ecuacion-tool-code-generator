# Read by ecuacion-references-tool-code-generator's navbar version badge
# (VersionUtil.getVersion("ecuacion-tool-code-generator")). Kept as its own
# version_<productName>.properties file, distinct from the unsuffixed version.properties in
# this same directory, because a consuming app may also carry its own unsuffixed
# version.properties for its own app version, and both would collide on the classpath under
# the same name if this one were unsuffixed too.
version=@project.version@
