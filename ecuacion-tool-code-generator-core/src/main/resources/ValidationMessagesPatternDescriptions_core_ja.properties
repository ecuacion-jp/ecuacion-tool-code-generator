templateVersion=半角英数字・「-」・「_」・「.」（例：5.0.0、5.0.0-SNAPSHOT）
systemName=半角英数字と「-」
basePackage=半角英小文字・数字・「.」
frameworkKind=「Spring Framework」または「jakarta EE」
characterEncoding=UTF-8のような文字コード名（半角英数字と「-_:.」）
lang="en"や"en_US"のようなロケール文字列
dataTypeName=「DT_」で始まり、半角英大文字・数字・「_」が続く（例：DT_USER_NAME）
upperSnakeCase=半角英大文字・数字・「_」（例：USER_NAME）
alNumDot=半角英数字と「.」
springAuditing=「CB」（CreatedBy）・「CD」（CreatedDate）・「LB」（LastModifiedBy）・「LD」（LastModifiedDate）のいずれか
relationKind=「@ManyToOne」または「@OneToOne」
